# ==============================================================================
# FPL Assistant – Docker Compose
# Services: backend (Go/Fiber) + mysql
#
# Usage:
#   docker compose up -d          # start all services
#   docker compose logs -f        # stream logs
#   docker compose down -v        # stop and remove volumes
# ==============================================================================

services:
  # ────────────────────────────────────────────────────────────────────────────
  # MySQL 8 — L2 persistent cache + data store
  # ────────────────────────────────────────────────────────────────────────────
  mysql:
    image: mysql:8.4
    container_name: fpl_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-fpl_secret}
      MYSQL_DATABASE: ${DB_NAME:-fpl_assistant}
      MYSQL_USER: ${DB_USER:-fpl_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-fpl_secret}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./scripts/db/init.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p${DB_PASSWORD:-fpl_secret}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ────────────────────────────────────────────────────────────────────────────
  # Go Backend — FPL Assistant Core
  # ────────────────────────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fpl_backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      APP_ENV: ${APP_ENV:-production}
      ENVIRONMENT: ${APP_ENV:-production}
      PORT: ${BACKEND_PORT:-18492}
      BIND_HOST: "0.0.0.0"
      FPL_BASE_URL: ${FPL_BASE_URL:-https://fantasy.premierleague.com/api}
      FPL_USER_AGENT: ${FPL_USER_AGENT:-FPL-Assistant-Desktop/1.0 (Go; Docker)}
      CACHE_TTL_MINUTES: ${CACHE_TTL_MINUTES:-60}
      # MySQL — uses the compose service name as the host
      DB_ENABLED: "true"
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_USER: ${DB_USER:-fpl_user}
      DB_PASSWORD: ${DB_PASSWORD:-fpl_secret}
      DB_NAME: ${DB_NAME:-fpl_assistant}
    ports:
      - "${BACKEND_PORT:-18492}:${BACKEND_PORT:-18492}"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:${BACKEND_PORT:-18492}/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  mysql_data:
    driver: local
